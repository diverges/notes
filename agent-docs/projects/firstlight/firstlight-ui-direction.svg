<text x="48" y="639" class="small">Keep six slots and four navigation buttons. Collapse quiet history; reveal reasons beside actions.</text>
<text x="824" y="639" class="small">Target identity and health. No combat cast bar or overall-level rating.</text>
<g transform="translate(48 686)">
 <rect class="panel" width="480" height="280"/><text x="20" y="35" class="h">Crafting bench</text><text x="438" y="34">×</text>
 <text x="20" y="65" class="small">Place materials left to right. Order matters.</text>
 <g transform="translate(24 91)"><rect class="slot" width="61" height="64"/><text x="24" y="39">1</text><rect class="slot" x="75" width="61" height="64"/><text x="99" y="39">2</text><rect class="slot" x="150" width="61" height="64"/><text x="174" y="39">3</text><text x="232" y="39">→</text><rect class="slot" x="272" width="61" height="64"/><text x="287" y="39" class="small">—</text></g>
 <text x="24" y="185">No combination yet</text><text x="24" y="211" class="small">Recipes stay hidden. A matched result shows its name.</text>
 <path class="rule" d="M20 228h440"/><text x="24" y="256" class="small">Matched but blocked: show the actual requirement.</text>
</g>
