<text x="48" y="49" class="label">FIRST LIGHT / GAME UI REVIEW / 01 OCT 2026</text>
<text x="48" y="94" class="h" style="font-size:38px">Worn materials. Clear decisions. Room for the forest.</text>
<text x="48" y="128" class="small">Proposed design study, not a game capture. Illustrative state values. Layout fonts are placeholders, not selected production assets.</text>
<text x="48" y="180" class="label">01 / EXPLORATION + BAG</text><text x="824" y="180" class="label">02 / COMBAT + HAZARD</text>
