 <path class="rule" d="M20 137h440"/><text x="20" y="165">Attack interval</text><text x="370" y="165">3 sec</text>
 <text x="20" y="198">Strength and enemy defence affect actual damage.</text>
 <text x="20" y="230" class="small">Compare against equipped gear before choosing Equip.</text><text x="20" y="255" class="small">Never imply cosmetic gear grants a combat bonus.</text>
</g>
<g transform="translate(1072 686)">
