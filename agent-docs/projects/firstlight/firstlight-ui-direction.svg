 <text x="20" y="80">Weapon Proficiency</text><text x="391" y="80">Lv. 1</text><rect x="20" y="94" width="440" height="4" fill="#48433E"/><rect x="20" y="94" width="108" height="4" fill="#B8A367"/>
 <text x="20" y="137">Helps your attacks get past an enemy’s Block.</text><text x="20" y="171">Improves when an attack lands.</text>
 <path class="rule" d="M20 194h440"/><text x="20" y="227" class="small">Show current XP and XP to next level on inspection.</text><text x="20" y="254" class="small">Explain skills; keep undiscovered recipes hidden.</text>
</g>
<text x="48" y="1020" class="label">MATERIAL + FEEDBACK LANGUAGE</text>
<rect x="48" y="1042" width="34" height="34" fill="#242729" stroke="#77766D"/><text x="93" y="1065">Charcoal</text><rect x="242" y="1042" width="34" height="34" fill="#DED9C6"/><text x="287" y="1065">Bone</text><rect x="409" y="1042" width="34" height="34" fill="#B8A367"/><text x="454" y="1065">Worn brass</text><rect x="614" y="1042" width="34" height="34" fill="#B7796E"/><text x="659" y="1065">Harm</text><rect x="785" y="1042" width="34" height="34" fill="#91A07A"/><text x="830" y="1065">Growth</text>
<text x="48" y="1114" class="small">Subtle edge wear only. Crisp text above world effects. Every warning has words or shape as well as color.</text>
<text x="48" y="1144" class="small">Sound proposal: cloth open/close · dry selection tap · restrained failure knock · quiet existing pickup/gear cues · rare warm level-up chime.</text>
</svg>

